name: Daily Quran script (8 PM ET)

on:
  schedule:
    # 8:00 PM America/New_York, both DST variants — the node script
    # double-checks the ET hour and only proceeds at exactly 8 PM.
    - cron: "0 0 * * *"   # 00:00 UTC = 8 PM EDT (summer)
    - cron: "0 1 * * *"   # 01:00 UTC = 8 PM EST (winter)
  workflow_dispatch:      # manual run builds today's script immediately

permissions:
  contents: write

jobs:
  build-script:
    runs-on: ubuntu-latest
    env:
      FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Arabic script from today's log
        run: node tools/build-daily-script.js

      - name: Commit generated script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Daily Quran script $(TZ=America/New_York date +%F)"
            git push
          fi
